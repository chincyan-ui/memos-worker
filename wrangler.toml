
name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]


# 1. 绑定 D1 数据库
[[d1_databases]]
binding = "DB"              # 代码中调用的变量名，保持默认
database_name = "memos-db"      # 你在 Cloudflare 创建的 D1 数据库名
database_id = "17e09052-5e6a-4b11-b66f-df276ed545c7"    # 替换为你的真实 ID


[[kv_namespaces]]
binding = "NOTES_KV"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "YOUR_R2_BUCKET_NAME"
preview_bucket_name = "notes-files-preview"
